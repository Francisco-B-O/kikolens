[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kikolens"
version = "1.4.0"
description = "Private, local-first data analysis with AutoML, neural networks and local LLMs"
readme = "README.md"
license = { text = "MIT" }
keywords = ["data analysis", "machine learning", "streamlit", "local-first", "forecasting", "data quality", "ollama"]
authors = [
  { name = "Francisco-B-O", email = "balonero18@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.50.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.19.0",
    "duckdb>=0.10.0",
    "sqlalchemy>=2.0.0",
    "openpyxl>=3.1.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "pyarrow>=15.0.0",
    "tabulate>=0.9.0"
]

[project.urls]
Homepage = "https://github.com/Francisco-B-O/kikolens"
Repository = "https://github.com/Francisco-B-O/kikolens"
Issues = "https://github.com/Francisco-B-O/kikolens/issues"
Changelog = "https://github.com/Francisco-B-O/kikolens/blob/main/CHANGELOG.md"

[project.scripts]
kikolens = "kikolens.cli.main:cli"

[project.optional-dependencies]
cloud = ["fsspec>=2023.1.0", "s3fs", "gcsfs"]
postgres = ["psycopg2-binary"]
mysql = ["pymysql", "cryptography"]
torch = ["torch>=2.2"]
jupyter = ["jupyterlab>=4.0", "ipykernel>=6.0"]
all = ["fsspec>=2023.1.0", "s3fs", "gcsfs", "psycopg2-binary", "pymysql", "cryptography"]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
docs = [
    "playwright>=1.45",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kikolens*"]

[tool.coverage.run]
relative_files = true
